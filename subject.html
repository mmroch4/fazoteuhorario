<script>
(function () {
  "use strict";
  const F = window.FCUP;
  const DATA = (window.TIMETABLE_DATA || {subjects: []}).subjects;
  const DAYS = F.DAYS, H0 = 8, H1 = 22, HH = 46;
  const esc = F.esc, min = F.min;
  let hidden = new Set();

  function wanted() {
    const h = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
    return h || (new URLSearchParams(location.search).get("code") || "").trim();
  }

  /* ---------- per-UC SEO -------------------------------------------------
     To a crawler this file is one URL per UC (`?code=CC1007` — the form the
     sitemap lists), not one page with 464 states. So the title, description and
     canonical have to follow whichever UC is on screen; otherwise every one of
     those URLs reports the same generic metadata and none of them can rank.
     Navigation between UCs still uses `#CC1007`, which is instant. */
  const SEO_BASE = (document.querySelector('link[rel="canonical"]') || {}).href || "";
  const SITE = SEO_BASE.replace(/subject\.html.*$/, "");
  function seo(title, desc, code) {
    document.title = title;
    const url = SITE + "subject.html" + (code ? "?code=" + encodeURIComponent(code) : "");
    const set = (sel, attr, val) => {
      const el = document.querySelector(sel);
      if (el) el[attr] = val;
    };
    set('meta[name="description"]', "content", desc);
    set('link[rel="canonical"]', "href", url);
    set('meta[property="og:title"]', "content", title);
    set('meta[property="og:description"]', "content", desc);
    set('meta[property="og:url"]', "content", url);
    set('meta[name="twitter:title"]', "content", title);
    set('meta[name="twitter:description"]', "content", desc);

    // Course structured data, replaced (not stacked) on every navigation.
    const old = document.getElementById("ld-uc");
    if (old) old.remove();
  }
  function courseLd(sub, slots) {
    const el = document.createElement("script");
    el.type = "application/ld+json";
    el.id = "ld-uc";
    el.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Course",
      name: sub.name,
      courseCode: sub.code,
      description: `Horário e turmas de ${sub.name} (${sub.code}), `
        + `${sub.academic_year}.º ano — ${sub.classes.length} turma(s), `
        + `${slots.length} aula(s) por semana.`,
      inLanguage: "pt-PT",
      url: SITE + "subject.html?code=" + encodeURIComponent(sub.code),
      provider: {"@type": "CollegeOrUniversity",
                 name: "Faculdade de Ciências da Universidade do Porto",
                 url: "https://sigarra.up.pt/fcup/"},
    });
    document.head.appendChild(el);
  }

  /* ---------- directory ------------------------------------------------- */
  function renderDirectory() {
    seo("Unidades curriculares da U.Porto — turmas e horários",
        "Todas as unidades curriculares com horário publicado: turmas, salas, "
        + "docentes e vagas, numa grelha semanal. Dados do SIGARRA da U.Porto.",
        null);
    document.getElementById("title").innerHTML =
      "Unidades curriculares <small>" + DATA.length + " no total</small>";
    document.getElementById("badges").innerHTML = "";
    document.getElementById("nav").innerHTML = "";
    document.getElementById("gridpanel").style.display = "none";
    const withT = DATA.filter(s => s.classes.some(c => c.slots.length));
    const without = DATA.filter(s => !s.classes.some(c => c.slots.length));
    const link = s => `<a href="#${encodeURIComponent(s.code)}">`
      + `<span class="dot" style="background:${esc(F.colourOf(s.code))}"></span>`
      + `<b>${esc(s.code)}</b> <span class="nm">${esc(s.name)}</span></a>`;
    document.getElementById("tablepanel").querySelector("h2").textContent = "Escolhe uma UC";
    document.getElementById("table").innerHTML =
      `<div class="dir">${withT.map(link).join("")}</div>`
      + `<h2 style="margin-top:18px">Sem horário publicado (${without.length})</h2>`
      + `<div class="dir">${without.map(link).join("")}</div>`;
  }

  /* ---------- one subject ------------------------------------------------ */
  function render(sub) {
    const colour = F.colourOf(sub.code);
    document.getElementById("title").innerHTML =
      `<span class="dot" style="background:${esc(colour)};margin-right:6px"></span>`
      + esc(sub.code) + " <small>" + esc(sub.name) + "</small>";

    const slots = sub.classes.flatMap(c => c.slots.map(s => ({cls: c, slot: s})));
    const hours = slots.reduce((a, x) => a + (min(x.slot.end) - min(x.slot.start)), 0) / 60;

    // Both halves of the title are searched for: people look up the code
    // ("CC1007 horário") about as often as the name.
    const typeList = [...new Set(sub.classes.map(c => c.type))].join(", ");
    seo(`${sub.code} ${sub.name} — horário e turmas`,
        slots.length
          ? `Horário de ${sub.name} (${sub.code}), ${sub.academic_year}.º ano: `
            + `${sub.classes.length} turma(s) ${typeList}, salas, docentes e vagas, `
            + `numa grelha semanal.`
          : `${sub.name} (${sub.code}), ${sub.academic_year}.º ano — ainda sem `
            + `horário publicado no SIGARRA.`,
        sub.code);
    if (slots.length) courseLd(sub, slots);
    document.getElementById("badges").innerHTML = [
      `${sub.academic_year}.º ano`,
      sub.semester,
      `${sub.classes.length} turma(s)`,
      `${slots.length} aula(s)/semana`,
      hours ? `${(hours % 1 ? hours.toFixed(1) : hours)} h/semana` : null,
      `ocorrência ${sub.occurrence_id}`,
    ].filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join("")
      + ` <a class="tag" href="${F.ucURL(sub.occurrence_id)}" target="_blank" rel="noopener">ficha no SIGARRA ↗</a>`;

    const i = DATA.indexOf(sub), prev = DATA[i - 1], next = DATA[i + 1];
    document.getElementById("nav").innerHTML =
      (prev ? `<a class="btn" href="#${encodeURIComponent(prev.code)}" title="${esc(prev.name)}">← ${esc(prev.code)}</a> ` : "")
      + `<a class="btn" href="subject.html">Todas</a> `
      + (next ? `<a class="btn" href="#${encodeURIComponent(next.code)}" title="${esc(next.name)}">${esc(next.code)} →</a>` : "");

    // colour picker + type filters
    const tools = document.getElementById("tools");
    tools.innerHTML = '<span style="font-size:12px;color:var(--muted)">Cor</span>';
    tools.appendChild(F.swatches(sub.code, () => route()));
    const types = [...new Set(sub.classes.map(c => c.type))];
    if (types.length > 1) {
      const sep = document.createElement("span");
      sep.style.cssText = "font-size:12px;color:var(--muted);margin-left:6px";
      sep.textContent = "Tipos";
      tools.appendChild(sep);
      for (const t of types) {
        const b = document.createElement("button");
        b.className = "chip";
        b.dataset.type = t;
        b.textContent = t;
        const on = !hidden.has(t);
        b.setAttribute("aria-pressed", String(on));
        if (on) { b.style.background = colour; b.style.color = "#fff"; b.style.borderColor = "transparent"; }
        b.onclick = () => { hidden.has(t) ? hidden.delete(t) : hidden.add(t); route(); };
        tools.appendChild(b);
      }
    }

    renderGrid(sub, slots, colour);
    renderTable(sub, colour);
  }

  const packDay = F.packDay;   // shared with index.html, see common.js

  function renderGrid(sub, slots, colour) {
    const nDays = slots.some(x => x.slot.day === 5) ? 6 : 5;
    const packedByDay = [];
    let maxLanes = 1;
    for (let day = 0; day < nDays; day++) {
      const p = packDay(slots.filter(x => x.slot.day === day));
      packedByDay.push(p);
      for (const it of p) maxLanes = Math.max(maxLanes, it._lanes);
    }

    const grid = document.getElementById("grid");
    grid.style.setProperty("--days", nDays);
    grid.style.setProperty("--hh", HH + "px");
    grid.style.setProperty("--colw", Math.max(130, maxLanes * 62) + "px");
    grid.innerHTML = '<div class="gh"></div>'
      + DAYS.slice(0, nDays).map(d => `<div class="gh">${esc(d)}</div>`).join("");

    const hrs = document.createElement("div");
    hrs.className = "hours";
    for (let h = H0; h <= H1; h++) {
      const e = document.createElement("div");
      e.className = "hour"; e.textContent = String(h).padStart(2, "0") + ":00";
      hrs.appendChild(e);
    }
    grid.appendChild(hrs);

    for (let day = 0; day < nDays; day++) {
      const col = document.createElement("div");
      col.className = "col";
      col.style.height = ((H1 - H0) * HH) + "px";
      for (let h = H0; h <= H1; h++) {
        const l = document.createElement("div");
        l.className = "line"; l.style.top = ((h - H0) * HH) + "px";
        col.appendChild(l);
      }
      for (const it of packedByDay[day]) {
        const s = it.slot, w = 100 / it._lanes;
        const el = document.createElement("div");
        el.className = "ev" + (hidden.has(it.cls.type) ? " dim" : "")
                     + (it.slot.regular ? "" : " oneoff");
        el.tabIndex = 0;
        el.style.top = ((min(s.start) - H0 * 60) / 60 * HH) + "px";
        el.style.height = Math.max((min(s.end) - min(s.start)) / 60 * HH - 2, 15) + "px";
        el.style.left = `calc(${it._lane * w}% + 1px)`;
        el.style.width = `calc(${w}% - 2px)`;
        el.style.right = "auto";
        el.style.setProperty("--c", colour);
        el.innerHTML = `<b>${esc(it.cls.name.replace(sub.code + "_", ""))}</b>`
          + `<span>${esc(s.start)}–${esc(s.end)}</span>`
          + (s.rooms.length ? `<span> ${esc(s.rooms.join(","))}</span>` : "");
        const open = () => F.showDetails({subject: sub, cls: it.cls, slot: s,
                                          onColour: () => route()});
        el.onclick = open;
        el.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); } };
        col.appendChild(el);
      }
      grid.appendChild(col);
    }

    const used = [...new Set(slots.map(x => x.slot.type).filter(Boolean))];
    document.getElementById("legend").innerHTML = used.length
      ? used.map(t => `<span><i style="background:${esc(colour)}"></i>${esc(t)}</span>`).join("")
        + '<span>— clica numa aula para ver os detalhes</span>'
      : '<span class="empty">Sem horário publicado para esta UC.</span>';
  }

  function renderTable(sub, colour) {
    const rows = sub.classes.map(c => {
      const when = c.slots.length
        ? c.slots.map(s => `${esc(DAYS[s.day])} ${esc(s.start)}–${esc(s.end)}`
            + (s.regular ? "" : ' <span class="tag">pontual</span>')).join("<br>")
        : '<span class="empty">sem horário publicado</span>';
      const rooms = [...new Set(c.slots.flatMap(s => s.rooms))].join(", ") || "—";
      const who = [...new Set(c.slots.flatMap(s => s.teachers))].join(", ") || "—";
      const per = c.slots.length ? `${esc(c.slots[0].first_date)} → ${esc(c.slots[0].last_date)}` : "—";
      const nm = c.turma_id
        ? `<a href="${F.turmaURL(c.turma_id)}" target="_blank" rel="noopener">${esc(c.name)}</a>`
        : esc(c.name);
      return `<tr class="${c.slots.length ? "" : "noslot"}"><td>${nm}</td>`
        + `<td><span class="ty" style="background:${esc(colour)}">${esc(c.type)}</span></td>`
        + `<td>${esc(c.vacant_places)}</td><td>${when}</td><td>${esc(rooms)}</td>`
        + `<td>${esc(who)}</td><td>${per}</td></tr>`;
    }).join("");
    document.getElementById("table").innerHTML =
      "<table><thead><tr><th>Turma</th><th>Tipo</th><th>Vagas</th><th>Quando</th>"
      + "<th>Sala</th><th>Docentes</th><th>Período</th></tr></thead><tbody>"
      + rows + "</tbody></table>";
  }

  function route() {
    const code = wanted();
    if (!code) return renderDirectory();
    const sub = DATA.find(s => s.code.toLowerCase() === code.toLowerCase());
    if (!sub) {
      document.getElementById("title").textContent = "UC não encontrada: " + code;
      document.getElementById("gridpanel").style.display = "none";
      document.getElementById("table").innerHTML =
        '<p class="empty">Verifica o código. <a href="subject.html">Ver todas as UCs</a></p>';
      return;
    }
    document.getElementById("gridpanel").style.display = "";
    document.getElementById("tablepanel").querySelector("h2").textContent = "Turmas";
    render(sub);
  }

  document.getElementById("print").onclick = () => window.print();
  addEventListener("hashchange", () => { hidden.clear(); route(); });
  route();
})();
</script>
